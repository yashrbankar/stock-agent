name: QScanner

on:
  workflow_dispatch:

jobs:
  code-scan:
    name: QScanner code scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan with QScanner
        uses: yashrbankar/random-test@main
        with:
          access-token: ${{ secrets.QUALYS_ACCESS_TOKEN }}
          pod: US1
          qscanner-version: v5.2.0
          scan-command: code
          target: .
          upload-artifact: 'true'
          fail-on-policy-deny: 'false'
